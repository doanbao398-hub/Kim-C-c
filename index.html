<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Bé Vui Học Toán - Mầm Non Kỳ Diệu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Canvas Confetti nhẹ cho hiệu ứng pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      /* 1. RESET & BASE STYLES - TỐI ƯU HIỆU NĂNG */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        font-family: "Fredoka", "Segoe UI", sans-serif;
        background: linear-gradient(
          135deg,
          #ff9a9e 0%,
          #fecfef 50%,
          #a1c4fd 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 12px;
        color: #333;
        overflow-x: hidden;
      }

      /* Hiệu ứng Flash đỏ màn hình khi trả lời sai */
      .screen-flash-red {
        animation: flashRedAnim 0.3s ease;
      }
      @keyframes flashRedAnim {
        0% {
          background-color: rgba(255, 82, 82, 0.85);
        }
        100% {
          background-color: rgba(255, 255, 255, 0.96);
        }
      }

      /* 2. GAME CARD */
      .game-card {
        background: #ffffff;
        width: 100%;
        max-width: 850px;
        border-radius: 24px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.1),
          0 0 0 5px rgba(255, 255, 255, 0.8);
        padding: 20px;
        position: relative;
        z-index: 2;
        overflow: hidden;
        will-change: transform;
      }

      /* Màn hình bắt đầu */
      .start-screen {
        text-align: center;
        padding: 20px 10px;
      }

      .start-title {
        font-size: 32px;
        color: #1565c0;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .start-desc {
        font-size: 18px;
        color: #555;
        margin-bottom: 25px;
      }

      .btn-start {
        background: linear-gradient(135deg, #66bb6a 0%, #43a047 100%);
        color: white;
        border: none;
        border-radius: 50px;
        padding: 14px 38px;
        font-size: 22px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 5px 0 #2e7d32;
        transition: transform 0.1s ease;
        font-family: "Fredoka", sans-serif;
      }

      .btn-start:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #2e7d32;
      }

      /* Header & Tiến trình */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .btn-audio {
        background: linear-gradient(135deg, #ff7297 0%, #ff4081 100%);
        border: 3px solid #ffffff;
        border-radius: 50%;
        width: 46px;
        height: 46px;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 0 #c2185b;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        flex-shrink: 0;
      }

      .btn-audio.speaking {
        animation: pulseBtn 0.4s infinite alternate;
      }

      @keyframes pulseBtn {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(1.1);
        }
      }

      .progress-bar {
        display: flex;
        gap: 6px;
        background: #fff0f5;
        padding: 6px 12px;
        border-radius: 20px;
        border: 2px dashed #ff80ab;
      }

      .star-slot {
        font-size: 22px;
      }
      .star-slot.empty {
        opacity: 0.25;
        filter: grayscale(100%);
      }
      .star-slot.gold {
        opacity: 1;
        transform: scale(1.1);
      }
      .star-slot.red {
        opacity: 1;
        transform: scale(1.1);
      }

      /* Question Box */
      .question-box {
        background: #e3f2fd;
        border: 2px solid #90caf9;
        border-radius: 16px;
        padding: 12px 14px;
        text-align: center;
        margin-bottom: 16px;
      }

      .question-title {
        font-size: 19px;
        font-weight: 700;
        color: #1565c0;
        line-height: 1.3;
      }

      /* ==========================================
       3. BỐ CỤC CHỌN ĐÁP ÁN (TỐI ƯU CỰC MƯỢT)
       ========================================== */
      .quiz-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        align-items: stretch;
      }

      @media (max-width: 600px) {
        .game-card {
          padding: 14px;
        }
        .quiz-container {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .option-card {
          min-height: 130px !important;
          padding: 10px !important;
        }
        .question-title {
          font-size: 16px;
        }
        .item-img {
          width: 36px !important;
          height: 36px !important;
        }
      }

      /* Thẻ đáp án bấm chọn */
      .option-card {
        background-color: #ffffff;
        border: 3px solid #e2e8f0;
        border-radius: 20px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        box-shadow: 0 6px 0 #cbd5e1;
        transition:
          transform 0.1s ease,
          background-color 0.1s ease;
        min-height: 200px;
        width: 100%;
        will-change: transform;
      }

      .option-card:active {
        transform: translateY(3px);
        box-shadow: 0 3px 0 #cbd5e1;
      }

      .side-badge {
        padding: 3px 12px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        color: white;
        margin-bottom: 6px;
      }
      .side-badge.left {
        background: #4caf50;
      }
      .side-badge.right {
        background: #ff5722;
      }

      /* Bố cục phân tầng đồ vật dạng GRID căn thẳng hàng theo cột */
      .items-group-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        justify-content: center;
        width: 100%;
        flex-grow: 1;
        margin: 4px 0;
      }

      .items-row {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(42px, max-content);
        gap: 10px;
        justify-content: center;
        align-items: center;
        width: 100%;
      }

      .items-row .grid-cell {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 44px;
        height: 44px;
      }

      .item-img {
        width: 44px;
        height: 44px;
        object-fit: contain;
      }

      .option-label {
        font-size: 15px;
        font-weight: 700;
        color: #37474f;
        text-align: center;
        margin-top: 4px;
      }

      /* Hiệu ứng phản hồi nhanh */
      .shake {
        animation: shakeAnim 0.3s ease-in-out;
        border-color: #ff5252 !important;
        background-color: #ffebee !important;
      }

      @keyframes shakeAnim {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }

      .correct-anim {
        border-color: #66bb6a !important;
        background-color: #f1f8e9 !important;
        transform: scale(1.02);
      }

      /* MÀN HÌNH TỔNG KẾT */
      .end-screen {
        display: none;
        text-align: center;
        padding: 10px 5px;
      }

      .end-title {
        font-size: 26px;
        color: #1565c0;
        margin-bottom: 6px;
        font-weight: 700;
      }

      .summary-card {
        background: #f8fafc;
        border: 2px dashed #90caf9;
        border-radius: 16px;
        padding: 10px;
        margin: 12px auto;
        max-width: 550px;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        background: white;
        border-radius: 10px;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 600;
      }

      .score-box {
        font-size: 20px;
        font-weight: 700;
        color: #2e7d32;
        margin-top: 8px;
      }

      .teacher-note {
        font-size: 15px;
        color: #555;
        margin-top: 4px;
        font-style: italic;
      }

      .btn-restart {
        background: linear-gradient(135deg, #42a5f5 0%, #1e88e5 100%);
        color: white;
        border: none;
        border-radius: 50px;
        padding: 12px 30px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 0 #1565c0;
        transition: transform 0.1s ease;
        font-family: "Fredoka", sans-serif;
        margin-top: 12px;
      }

      .btn-restart:active {
        transform: translateY(3px);
      }
    </style>
  </head>
  <body>
    <div class="game-card" id="main-game-card">
      <!-- Màn hình bắt đầu -->
      <div id="start-screen" class="start-screen">
        <div style="font-size: 50px; margin-bottom: 8px">🌟🧸✨</div>
        <h1 class="start-title">BÉ VUI HỌC TOÁN</h1>
        <p class="start-desc">Bé hãy chạm hoặc bấm chọn vào đáp án đúng nhé!</p>
        <button class="btn-start" onclick="startGame()">BẮT ĐẦU CHƠI 🚀</button>
      </div>

      <!-- Màn hình chơi game -->
      <div id="quiz-screen" style="display: none">
        <div class="header">
          <button
            class="btn-audio"
            id="btn-audio"
            onclick="playCurrentAudio()"
            title="Nghe câu hỏi"
          >
            🔊
          </button>
          <div class="progress-bar" id="progress-bar-container"></div>
        </div>

        <div class="question-box">
          <h2 class="question-title" id="question-text">Đang tải...</h2>
        </div>

        <!-- BỐ CỤC 2 ĐÁP ÁN BẤM CHỌN -->
        <div class="quiz-container">
          <div id="left-option-slot" style="width: 100%"></div>
          <div id="right-option-slot" style="width: 100%"></div>
        </div>
      </div>

      <!-- Màn hình tổng kết -->
      <div id="end-screen" class="end-screen">
        <h2 class="end-title">📊 BẢNG TỔNG KẾT BÀI HỌC</h2>
        <p style="font-size: 14px; color: #666">
          Kết quả đánh giá từng câu hỏi của bé:
        </p>
        <div class="summary-card" id="summary-list"></div>
        <div class="score-box" id="final-score-text">Đạt: 0/0 Sao Vàng</div>
        <div class="teacher-note" id="teacher-eval-note"></div>
        <div>
          <button class="btn-restart" onclick="restartGame()">
            🔄 CHƠI LẠI TỪ ĐẦU
          </button>
        </div>
      </div>
    </div>

    <script>
      /* ==========================================
       1. DỮ LIỆU CÂU HỎI & PRELOAD AUDIO
       ========================================== */
      const quizData = [
        {
          id: 1,
          question: "Bé ơi, hãy chọn đĩa có NHIỀU HƠN giúp cô nhé!",
          audioSrc: "noi1.mp3",
          options: [
            {
              label: "3 cái chén",
              row1: ["chen.png", "chen.png", "chen.png"],
              isCorrect: true,
            },
            {
              label: "2 cái muỗng",
              row1: ["muon.png", "muon.png"],
              isCorrect: false,
            },
          ],
        },
        {
          id: 2,
          question: "Bé giỏi lắm! Bây giờ hãy chọn nhóm ÍT HƠN nào!",
          audioSrc: "noi2.mp3",
          options: [
            {
              label: "2 cái bàn",
              row1: ["ban.png", "ban.png"],
              isCorrect: false,
            },
            { label: "1 cái ghế", row1: ["ghe.png"], isCorrect: true },
          ],
        },
        {
          id: 3,
          question: "Bé hãy tìm nhóm có CHÉN và DĨA BẰNG NHAU nhé!",
          audioSrc: "noi3.mp3",
          options: [
            {
              label: "Nhóm 1 (3 chén, 3 dĩa)",
              row1: ["chen.png", "chen.png", "chen.png"],
              row2: ["dia.png", "dia.png", "dia.png"],
              isCorrect: true,
            },
            {
              label: "Nhóm 2 (3 chén, 2 dĩa)",
              row1: ["chen.png", "chen.png", "chen.png"],
              row2: ["dia.png", "dia.png"],
              isCorrect: false,
            },
          ],
        },
      ];

      // Kỹ thuật Cache Audio giúp phát lại tức thì không cần chờ tải lại qua mạng
      const audioCache = {};
      function preloadAudios() {
        [
          "noi1.mp3",
          "noi2.mp3",
          "noi3.mp3",
          "tldung.mp3",
          "votay.mp3",
          "sai.mp3",
          "nhacket.mp3",
        ].forEach((src) => {
          const a = new Audio();
          a.src = src;
          audioCache[src] = a;
        });
      }
      window.addEventListener("load", preloadAudios);

      let currentQuestionIndex = 0;
      let isProcessing = false;
      let currentAudio = null;
      let questionResults = new Array(quizData.length).fill(null);
      let finishMusic = null;

      /* ==========================================
       2. HỆ THỐNG ÂM THANH MƯỢT HƠN
       ========================================== */
      function playCurrentAudio() {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }

        const audioFile = quizData[currentQuestionIndex].audioSrc;
        currentAudio = audioCache[audioFile] || new Audio(audioFile);
        currentAudio.currentTime = 0;

        const btnAudio = document.getElementById("btn-audio");
        currentAudio.onplay = () => btnAudio.classList.add("speaking");
        currentAudio.onended = () => btnAudio.classList.remove("speaking");
        currentAudio.onerror = () => btnAudio.classList.remove("speaking");

        currentAudio.play().catch(() => btnAudio.classList.remove("speaking"));
      }

      function playCorrectSequence(onFinished) {
        const audioRight = audioCache["tldung.mp3"] || new Audio("tldung.mp3");
        const audioCheer = audioCache["votay.mp3"] || new Audio("votay.mp3");

        audioRight.currentTime = 0;
        audioRight
          .play()
          .then(() => {
            audioRight.onended = () => {
              audioCheer.currentTime = 0;
              audioCheer
                .play()
                .then(() => {
                  audioCheer.onended = () => {
                    if (onFinished) onFinished();
                  };
                })
                .catch(() => {
                  if (onFinished) onFinished();
                });
            };
          })
          .catch(() => {
            if (onFinished) onFinished();
          });
      }

      function playWrongSequence(onFinished) {
        const audioWrong = audioCache["sai.mp3"] || new Audio("sai.mp3");
        const cardContainer = document.getElementById("main-game-card");

        cardContainer.classList.add("screen-flash-red");
        audioWrong.currentTime = 0;
        audioWrong
          .play()
          .then(() => {
            audioWrong.onended = () => {
              cardContainer.classList.remove("screen-flash-red");
              if (onFinished) onFinished();
            };
          })
          .catch(() => {
            setTimeout(() => {
              cardContainer.classList.remove("screen-flash-red");
              if (onFinished) onFinished();
            }, 500);
          });
      }

      /* ==========================================
       3. ĐIỀU HƯỚNG GAME & RENDER GIAO DIỆN
       ========================================== */
      function startGame() {
        document.getElementById("start-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        loadQuestion();
      }

      function restartGame() {
        if (finishMusic) {
          finishMusic.pause();
          finishMusic.currentTime = 0;
        }
        currentQuestionIndex = 0;
        questionResults = new Array(quizData.length).fill(null);
        isProcessing = false;

        document.getElementById("end-screen").style.display = "none";
        document.getElementById("quiz-screen").style.display = "block";
        loadQuestion();
      }

      function updateProgressBar() {
        const container = document.getElementById("progress-bar-container");
        container.innerHTML = "";

        quizData.forEach((_, idx) => {
          const span = document.createElement("span");
          span.className = "star-slot";

          if (questionResults[idx] === "gold") {
            span.classList.add("gold");
            span.innerText = "⭐";
          } else if (questionResults[idx] === "red") {
            span.classList.add("red");
            span.innerText = "🔴";
          } else {
            span.classList.add("empty");
            span.innerText = "⭐";
          }
          container.appendChild(span);
        });
      }

      function loadQuestion() {
        isProcessing = false;
        updateProgressBar();

        const currentQuiz = quizData[currentQuestionIndex];
        document.getElementById("question-text").innerText =
          currentQuiz.question;

        const leftSlot = document.getElementById("left-option-slot");
        const rightSlot = document.getElementById("right-option-slot");
        leftSlot.innerHTML = "";
        rightSlot.innerHTML = "";

        leftSlot.appendChild(
          createOptionCard(currentQuiz.options[0], "left", "ĐÁP ÁN A"),
        );
        rightSlot.appendChild(
          createOptionCard(currentQuiz.options[1], "right", "ĐÁP ÁN B"),
        );

        setTimeout(() => playCurrentAudio(), 200);
      }

      function createOptionCard(opt, side, sideText) {
        const card = document.createElement("div");
        card.className = "option-card";

        card.onclick = () => triggerSelection(card, opt.isCorrect);

        const len1 = opt.row1 ? opt.row1.length : 0;
        const len2 = opt.row2 ? opt.row2.length : 0;
        const maxCols = Math.max(len1, len2);

        let rowsHTML = '<div class="items-group-container">';

        if (len1 > 0) {
          rowsHTML += `<div class="items-row" style="grid-template-columns: repeat(${maxCols}, 44px);">`;
          for (let i = 0; i < maxCols; i++) {
            rowsHTML +=
              i < len1
                ? `<div class="grid-cell"><img src="${opt.row1[i]}" class="item-img" alt="icon"></div>`
                : `<div class="grid-cell"></div>`;
          }
          rowsHTML += `</div>`;
        }

        if (len2 > 0) {
          rowsHTML += `<div class="items-row" style="grid-template-columns: repeat(${maxCols}, 44px);">`;
          for (let i = 0; i < maxCols; i++) {
            rowsHTML +=
              i < len2
                ? `<div class="grid-cell"><img src="${opt.row2[i]}" class="item-img" alt="icon"></div>`
                : `<div class="grid-cell"></div>`;
          }
          rowsHTML += `</div>`;
        }

        rowsHTML += "</div>";

        card.innerHTML = `
          <div class="side-badge ${side}">${sideText}</div>
          ${rowsHTML}
          <div class="option-label">${opt.label}</div>
        `;

        return card;
      }

      function triggerSelection(cardElement, isCorrect) {
        if (isProcessing) return;
        isProcessing = true;
        if (currentAudio) currentAudio.pause();

        if (isCorrect) {
          questionResults[currentQuestionIndex] = "gold";
          updateProgressBar();
          cardElement.classList.add("correct-anim");
          triggerConfetti();

          playCorrectSequence(() => nextQuestionOrEnd());
        } else {
          questionResults[currentQuestionIndex] = "red";
          updateProgressBar();
          cardElement.classList.add("shake");

          playWrongSequence(() => nextQuestionOrEnd());
        }
      }

      function nextQuestionOrEnd() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
          loadQuestion();
        } else {
          showEndScreen();
        }
      }

      function showEndScreen() {
        if (currentAudio) currentAudio.pause();
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("end-screen").style.display = "block";

        finishMusic = audioCache["nhacket.mp3"] || new Audio("nhacket.mp3");
        finishMusic.currentTime = 0;
        finishMusic.play().catch(() => {});

        const summaryList = document.getElementById("summary-list");
        summaryList.innerHTML = "";
        let goldCount = 0;

        quizData.forEach((quiz, idx) => {
          const isGold = questionResults[idx] === "gold";
          if (isGold) goldCount++;

          const row = document.createElement("div");
          row.className = "summary-row";
          row.innerHTML = `
            <span>Câu ${idx + 1}: ${quiz.options.find((o) => o.isCorrect).label}</span>
            <span>${isGold ? "⭐ (Đúng)" : "🔴 (Chưa đúng)"}</span>
          `;
          summaryList.appendChild(row);
        });

        document.getElementById("final-score-text").innerText =
          `Đạt ${goldCount}/${quizData.length} Sao Vàng`;

        const noteElem = document.getElementById("teacher-eval-note");
        if (goldCount === quizData.length) {
          noteElem.innerText =
            "🌟 Nhận xét: Bé đạt điểm tuyệt đối! Rất xuất sắc!";
          triggerConfetti();
        } else if (goldCount >= Math.ceil(quizData.length / 2)) {
          noteElem.innerText =
            "👍 Nhận xét: Bé làm bài khá tốt, cô cần hỗ trợ bé ôn thêm các câu bị Sao Đỏ nhé!";
        } else {
          noteElem.innerText =
            "💪 Nhận xét: Bé cần luyện tập thêm cùng cô giáo và phụ huynh!";
        }
      }

      /* Hiệu ứng pháo hoa nhẹ tối ưu số lượng hạt */
      function triggerConfetti() {
        confetti({
          particleCount: 30,
          spread: 60,
          origin: { y: 0.6 },
        });
      }
    </script>
  </body>
</html>
